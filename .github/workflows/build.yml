name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Đặt tên file APK
        run: cp app/build/outputs/apk/release/app-release.apk QuayCanh.apk

      - uses: actions/upload-artifact@v4
        with:
          name: QuayCanh-apk
          path: QuayCanh.apk

      - name: Đưa APK lên nhánh apk (link tải cố định)
        run: |
          mkdir -p /tmp/apk && cp QuayCanh.apk /tmp/apk/
          cd /tmp/apk
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add QuayCanh.apk
          git commit -q -m "APK bản ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk

      - name: Tạo bản phát hành để tải APK
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Quay Cảnh - bản ${{ github.run_number }}
          body: Tải file QuayCanh.apk bên dưới về điện thoại Android rồi cài đặt.
          files: QuayCanh.apk
          make_latest: true
