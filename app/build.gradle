plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.quaycanh.app'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.quaycanh.app'
        minSdk 24
        targetSdk 34
        versionCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName = '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        // Khóa ký cố định để cài bản mới đè lên bản cũ mà không mất dữ liệu
        release {
            storeFile file('quaycanh.keystore')
            storePassword 'quaycanh123'
            keyAlias 'quaycanh'
            keyPassword 'quaycanh123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    androidResources {
        noCompress 'm4a'
    }
}

dependencies {
    // tránh trùng lớp kotlin-stdlib giữa các thư viện
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-video:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    def media3 = '1.4.1'
    implementation "androidx.media3:media3-transformer:$media3"
    implementation "androidx.media3:media3-effect:$media3"
    implementation "androidx.media3:media3-common:$media3"

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
